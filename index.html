<style>
:root{--navy:#0b1d3a;--navy2:#13294f;--gold:#d9b45a;--gold2:#f0d78c;--cream:#f4ecd8;--beige:#7e7256;--bg:url(assets/fondo.jpg)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#050d1c;color:var(--cream);-webkit-tap-highlight-color:transparent}
body{font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden}
body.lock{overflow:hidden;height:100%}
img{display:block;user-select:none;-webkit-user-drag:none}
/* ---------- SOBRE ---------- */
.env-screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(28px,6vh,52px);background:var(--bg) center/cover,var(--navy);transition:opacity .9s ease,transform .9s ease}
.env-screen::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(2,8,20,.55));pointer-events:none}
.env-screen.leave{opacity:0;transform:scale(1.08);pointer-events:none}
.env-title{position:relative;z-index:1;text-align:center;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.42em;color:var(--gold);text-transform:uppercase;animation:fadeUp 1.2s .2s backwards}
.env{--ew:min(84vw,400px);position:relative;z-index:1;width:var(--ew);height:calc(var(--ew)*.68);perspective:1400px;isolation:isolate;animation:fadeUp 1.2s .4s backwards,bob 5s 1.6s ease-in-out infinite}
.env.open{animation:none}
.env-back{position:absolute;inset:0;z-index:-1;border-radius:5px;background:linear-gradient(#183463,#0f2347);box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 1px rgba(217,180,90,.35)}
.letter{position:absolute;left:7%;right:7%;top:5%;bottom:5%;z-index:1;border-radius:3px;background:var(--bg) center/cover;border:1px solid rgba(217,180,90,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;transition:transform 1s cubic-bezier(.2,.8,.2,1) .55s}
.letter img{width:46%}.letter img+img{width:62%}
.env.open .letter{transform:translateY(-44%)}
.front{position:absolute;inset:0;z-index:2;width:100%;height:100%;filter:drop-shadow(0 -2px 6px rgba(0,0,0,.25))}
.flap{position:absolute;left:0;top:0;width:100%;height:56%;z-index:3;transform-origin:top center;transition:transform .9s cubic-bezier(.5,0,.2,1),z-index 0s .45s;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.flap svg{width:100%;height:100%;display:block;overflow:visible}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.seal{position:absolute;left:50%;top:56%;width:19%;aspect-ratio:1;z-index:4;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1d3b6c,#0a1a36);border:2px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 0 0 4px rgba(11,29,58,.9),inset 0 0 0 5px rgba(217,180,90,.5);display:grid;place-items:center;transition:opacity .35s,scale .35s}
.seal img{width:56%}
.env.open .seal{opacity:0;scale:.5}
.btn-open{position:relative;z-index:1;font-family:'Cinzel',serif;font-size:14px;letter-spacing:.38em;text-transform:uppercase;padding:15px 42px 15px 46px;border:0;border-radius:40px;cursor:pointer;color:#0b1d3a;background:linear-gradient(135deg,#f0d78c,#c9a04a 55%,#e6c673);box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.25) inset;animation:fadeUp 1.2s .8s backwards,glow 2.6s 2s ease-in-out infinite;transition:transform .2s,opacity .4s}
.btn-open:hover{transform:translateY(-2px) scale(1.03)}.btn-open:active{transform:scale(.97)}
.env-screen.go .btn-open,.env-screen.go .env-title{opacity:0;pointer-events:none}
/* ---------- INVITACIÓN ---------- */
.music{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:rgba(11,29,58,.78);backdrop-filter:blur(6px);cursor:pointer;display:none;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.music.on{display:grid}.music svg{width:20px;height:20px;fill:var(--gold)}.music .p{display:none}.music.paused .p{display:block}.music.paused .s{display:none}
.wrap{opacity:0;visibility:hidden;background:#050d1c}
.wrap.show{visibility:visible;opacity:1;transition:opacity 1.2s ease}
.inv,.foot{position:relative;width:min(100%,520px);margin:0 auto;container-type:inline-size;overflow:hidden}
.inv{background:var(--bg) 0 0/100% auto repeat-y,var(--navy)}
.inv{aspect-ratio:2550/9892}
.L{position:absolute;height:auto}
.rv{opacity:0;transform:translateY(2.2cqw) scale(.985);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.crown{perspective:700px}
.crown img{width:100%;animation:spin 5.5s cubic-bezier(.45,0,.25,1) infinite,shine 2.8s ease-in-out infinite}
.vine{transform-origin:var(--o);animation:sway 7s ease-in-out infinite}
.bf{position:absolute;animation:drift var(--t) ease-in-out var(--d) infinite}
.bf img{width:100%;animation:flap var(--f) ease-in-out var(--d) infinite}
.act{position:absolute;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--cream)}
.loc{left:50%;translate:-50% -50%;width:46cqw;height:8.6cqw;gap:2cqw;border:1px solid var(--gold);border-radius:10cqw;font-family:'Cinzel',serif;font-size:2.7cqw;letter-spacing:.2em;text-transform:uppercase;background:rgba(217,180,90,.1);box-shadow:0 0 0 0 rgba(217,180,90,.5);animation:ring 2.8s infinite;transition:background .25s,color .25s}
.loc svg{width:3.4cqw;height:3.4cqw;fill:var(--gold);transition:fill .25s}
.loc:hover,.loc:active{background:var(--gold);color:var(--navy)}.loc:hover svg,.loc:active svg{fill:var(--navy)}
.pill{border-radius:1.6cqw;animation:ring 2.8s infinite;transition:background .25s}
.pill+.pill{animation-delay:.5s}
.pill:hover,.pill:active{background:rgba(255,255,255,.12)}
.pax{position:absolute;left:50%;translate:-50% -50%;text-align:center;font-family:'Cinzel',serif;color:var(--cream);white-space:nowrap}
.pax.a{font-size:1.5cqw;letter-spacing:.06em}
.pax.b{display:grid;place-items:center;background:#7e7256;border-radius:3.2cqw;font-family:'Cormorant Garamond',serif;font-size:3.1cqw;letter-spacing:.02em;font-weight:500}
/* ---------- CUENTA REGRESIVA ---------- */
.fin{position:relative;padding:56cqw 0 14cqw;text-align:center;background:var(--bg) 0 -129.1cqw/100% auto repeat-y,var(--navy)}
.fin .fl{position:absolute;top:0;width:39cqw;transform:scaleY(-1)}
.fin h3{font-family:'Pinyon Script',cursive;font-weight:400;font-size:12cqw;line-height:1;color:#fff;margin-top:-4cqw}
.fin p{font-family:'Cinzel',serif;font-size:2.7cqw;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin:3cqw 0 6cqw}
.cd{display:flex;justify-content:center;gap:2.6cqw}
.u{width:17.5cqw;padding:3.6cqw 0 3cqw;border-radius:2.4cqw;background:linear-gradient(#2f4f81,#1f3a66);border:1px solid rgba(217,180,90,.35);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.u b{display:block;font-weight:400;font-size:9.4cqw;line-height:1;color:#fff;font-variant-numeric:lining-nums tabular-nums}
.u span{display:block;margin-top:2cqw;font-family:'Cinzel',serif;font-size:2.1cqw;letter-spacing:.2em;color:var(--gold2)}
.orn{width:30cqw;margin:8cqw auto 0}
.fin .end{font-family:'Pinyon Script',cursive;font-size:8cqw;color:#fff;margin-top:4cqw}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes glow{50%{box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 26px rgba(240,215,140,.55)}}
@keyframes spin{0%,12%{transform:rotateY(0)}62%,100%{transform:rotateY(360deg)}}
@keyframes shine{50%{filter:drop-shadow(0 0 1.6cqw rgba(240,215,140,.85))}}
@keyframes sway{50%{transform:rotate(var(--r)) scale(1.015)}}
@keyframes drift{0%,100%{translate:0 0;rotate:0deg}25%{translate:2.4cqw -1.6cqw;rotate:9deg}50%{translate:-.8cqw -3.4cqw;rotate:-5deg}75%{translate:-2.6cqw -.8cqw;rotate:6deg}}
@keyframes wander{0%,100%{translate:0 0;rotate:-4deg}20%{translate:3.2cqw -2.4cqw;rotate:10deg}45%{translate:1cqw -5cqw;rotate:-6deg}70%{translate:-3cqw -2.8cqw;rotate:8deg}}
.bf.w{animation:wander var(--t) ease-in-out var(--d) infinite;opacity:.92}
.fin .bf{z-index:1}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.38)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(217,180,90,.55)}70%,100%{box-shadow:0 0 0 2.2cqw rgba(217,180,90,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.rv{opacity:1;transform:none}}

<script>
(function(){
  var env=document.getElementById('env'),envl=document.getElementById('envelope'),wrap=document.getElementById('wrap'),btn=document.getElementById('openBtn');
  var q=new URLSearchParams(location.search),pax=parseInt(q.get('pax')||q.get('invitados'),10);
  if(pax>0)document.getElementById('paxBadge').textContent='('+pax+' PAX)';
  var rm=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function reveal(){
    var els=document.querySelectorAll('.rv');
    if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return}
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -6% 0px'});
    els.forEach(function(e){io.observe(e)});
  }
  function show(){
    wrap.classList.add('show');document.body.classList.remove('lock');window.scrollTo(0,0);
    setTimeout(function(){env.style.display='none'},1000);reveal();
  }
  var bgm=document.getElementById('bgm'),mb=document.getElementById('music');
  bgm.addEventListener('error',function(){mb.classList.remove('on')});
  mb.addEventListener('click',function(){if(bgm.paused){bgm.play();mb.classList.remove('paused')}else{bgm.pause();mb.classList.add('paused')}});
  btn.addEventListener('click',function(){
    bgm.play().then(function(){mb.classList.add('on')}).catch(function(){});
    if(btn.disabled)return;btn.disabled=true;env.classList.add('go');envl.classList.add('open');
    setTimeout(function(){env.classList.add('leave');show()},rm?50:2000);
  });
  /* cuenta regresiva: sábado 26 dic 2026, 12:00 pm (hora de Tijuana, UTC-8) */
  var T=Date.UTC(2026,11,26,20,0,0);
  function p(n){return n<10?'0'+n:''+n}
  function tick(){
    var t=Math.max(0,T-Date.now()),s=Math.floor(t/1000);
    document.getElementById('d').textContent=p(Math.floor(s/86400));
    document.getElementById('h').textContent=p(Math.floor(s%86400/3600));
    document.getElementById('m').textContent=p(Math.floor(s%3600/60));
    document.getElementById('s').textContent=p(s%60);
    if(t===0)document.getElementById('end').textContent='¡Hoy es el gran día!';
  }
  tick();setInterval(tick,1000);
})();
</script>
</body></html>
